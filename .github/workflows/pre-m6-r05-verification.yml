name: PRE-M6-R05 verification rerun

on:
  push:
    branches: [ci/pre-m6-r05-verification-rerun]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pandas scikit-learn
      - name: Focused config tests
        run: python -m pytest tests/test_config.py
      - name: Adjacent regression tests
        run: python -m pytest tests/test_loader.py tests/test_splits.py tests/test_environment.py tests/test_adaptation.py
      - name: Full test suite
        run: python -m pytest
