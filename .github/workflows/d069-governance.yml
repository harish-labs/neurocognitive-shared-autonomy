name: D069 Governance

on:
  push:
    branches:
      - ops/d069-governance

permissions:
  contents: write

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/d069-governance
          fetch-depth: 0
      - name: Apply governance to canonical main
        run: |
          cp ops/d069_governance.py /tmp/d069_governance.py
          git fetch origin main
          git switch -C main origin/main
          git config user.name "harish-labs"
          git config user.email "145137376+harish-labs@users.noreply.github.com"
          python /tmp/d069_governance.py
