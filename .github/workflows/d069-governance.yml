          ---

          # 20. ACCEPTANCE / STOP

          PASS only if:

          - start causes zero movement;
          - each advance performs at most one safety-approved environment transition;
          - human PAUSE/STOP/OVERRIDE/active-confirmation state is rechecked before every move;
