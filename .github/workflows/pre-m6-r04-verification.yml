name: PRE-M6-R04 Temporary Verification
on:
  push:
    branches: [ci/pre-m6-r04-verification]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -r requirements.txt pandas scikit-learn
      - run: python -m pytest tests/test_adaptation.py
      - run: python -m pytest tests/test_adaptation.py tests/test_bayes.py tests/test_shared_autonomy.py
      - run: python -m pytest
