name: Verify repository ref

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or exact 40-character commit SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Verify resolved ref
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.ref }}'
          resolved="$(git rev-parse HEAD)"
          echo "Requested ref: ${requested}"
          echo "Resolved SHA: ${resolved}"

          if [[ "${requested}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            if [[ "${resolved,,}" != "${requested,,}" ]]; then
              echo "Exact SHA verification failed."
              exit 1
            fi
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q -p no:cacheprovider

      - name: Check diff integrity
        run: git diff --check

      - name: Report working tree status
        if: always()
        run: git status --short
