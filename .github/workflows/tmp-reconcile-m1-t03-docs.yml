name: Temporary M1-T03 documentation reconciliation

on:
  push:
    branches:
      - docs/m1-t03-methodology-reconciliation-v2

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: docs/m1-t03-methodology-reconciliation-v2
          fetch-depth: 0

      - name: Verify canonical source blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object docs/06_DATASET_AND_DATA_PIPELINE.md)" = "da82f3ed8d6a448a524561ec774287962974d966"
          test "$(git hash-object docs/08_EEG_SIGNAL_PROCESSING_AND_ML.md)" = "274340a19905d8180b08a5698eb46ef3b8d62625"
          test "$(git hash-object docs/15_IMPLEMENTATION_BLUEPRINT.md)" = "2936d0f8f4d56b61567e48d5a821edb0bba59f85"

      - name: Apply reviewed documentation patch
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, os
          data = gzip.decompress(base64.b64decode(os.environ['PATCH_GZ_B64']))
          open('/tmp/m1_t03_docs.patch', 'wb').write(data)
          PY
          git apply --check /tmp/m1_t03_docs.patch
          git apply /tmp/m1_t03_docs.patch

      - name: Validate reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq 'D-031 through D-039' docs/06_DATASET_AND_DATA_PIPELINE.md
          grep -Fq 'The approved initial M1 filter is 7–30 Hz.' docs/08_EEG_SIGNAL_PROCESSING_AND_ML.md
          grep -Fq 'Scientific parameters approved for M1-T03' docs/15_IMPLEMENTATION_BLUEPRINT.md
          ! grep -Fq 'The exact final filter limits are still unresolved.' docs/08_EEG_SIGNAL_PROCESSING_AND_ML.md
          ! grep -Fq '# 26. BAND-PASS FILTER — UNRESOLVED PROJECT PARAMETER' docs/06_DATASET_AND_DATA_PIPELINE.md

      - name: Commit reconciled documents and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-reconcile-m1-t03-docs.yml
          git add docs/06_DATASET_AND_DATA_PIPELINE.md docs/08_EEG_SIGNAL_PROCESSING_AND_ML.md docs/15_IMPLEMENTATION_BLUEPRINT.md
          git commit -m 'Reconcile numbered M1 preprocessing methodology'
          git push origin HEAD:docs/m1-t03-methodology-reconciliation-v2
