conflicting human-action/controller state fails closed
forged structurally inconsistent SharedAutonomyDecision values fail closed
no planner import/call
no safety import/call
no environment.step call
no executor/replanning call
no EEG/model/adaptation/UI dependency
identical inputs on fresh controllers produce identical results/state
