name: Apply D-068 Governance

on:
  push:
    branches:
      - ci/m5-t01-verification

permissions:
  contents: write

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance branch
        uses: actions/checkout@v4
        with:
          ref: ci/m5-t01-verification
          path: governance
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo
      - name: Configure git
        working-directory: repo
        run: |
          git config user.name "harish-labs"
          git config user.email "145137376+harish-labs@users.noreply.github.com"
      - name: Record D-068
        run: python governance/.github/governance/apply_d068.py decision repo
      - name: Commit D-068
        working-directory: repo
        run: |
          git add DECISIONS.md
          git commit -m "Approve shared-autonomy authorization contract D-068"
          git push origin main
      - name: Authorize M5-T02
        run: python governance/.github/governance/apply_d068.py task repo
      - name: Commit M5-T02 authorization
        working-directory: repo
        run: |
          git add CURRENT_TASK.md
          git commit -m "Authorize M5-T02 authorization bridge"
          git push origin main
      - name: Advance project state
        run: python governance/.github/governance/apply_d068.py state repo
      - name: Commit project state
        working-directory: repo
        run: |
          git add PROJECT_STATE.md
          git commit -m "Advance project state to M5-T02"
          git push origin main
      - name: Report commits
        working-directory: repo
        run: git log -3 --oneline
