# 6. INPUT CONTRACT

The bridge consumes:

```text
SharedAutonomyDecision
HumanInteractionController / current HumanControlState
caller-supplied current symbolic mission-goal registry
caller-supplied request_id only when a CONFIRM decision needs a new confirmation request
```

The current goal registry should represent exact currently configured symbolic goal identifiers, normally keys equivalent to `EnvironmentConfig.goals`.

Do not hard-code goal names or victim identities.

Do not use goal-registry values, substring matching, nearest-goal matching, or planner preference to reinterpret a symbolic policy goal.

---

# 7. OUTPUT CONTRACT

Return an immutable structured bridge result sufficient to audit at least:

```text
status
policy_mode
candidate_goal, if any
approved_goal after handling
active_request_id after handling, if any
holds_position
requests_human_input
policy_goal_adopted: bool
confirmation_opened: bool
reason
```

Recommended status semantics may include:

```text
AUTHORIZED
WAITING_FOR_CONFIRMATION
HOLD
REJECTED
INVALID_GOAL
INVALID_STATE
```

Exact enum names may differ if behavior is explicit and deterministic.

Do not expose an executed action, path, planner result, safety result, or environment transition in M5-T02.

---

# 8. SYMBOLIC GOAL VALIDATION

For PROCEED and CONFIRM candidates:

```text
goal must be a non-empty symbolic identifier
goal must exactly match a current goal-registry key
no substring/fuzzy/value matching
no fallback goal
no hard-coded Left/Right -> victim mapping
```

Invalid or missing identity fails closed with no goal-state mutation and no movement.

M5-T02 keeps the approved goal symbolic. Coordinate resolution belongs to later execution integration against the then-current environment snapshot.

---

# 9. PROCEED SEMANTICS

Accept a PROCEED authorization only when the decision is structurally consistent with the accepted policy shape, including a valid exact symbolic approved goal.

Required behavior:

```text
controller STOPPED -> INVALID_STATE / HOLD
controller PAUSED -> INVALID_STATE / HOLD
active unresolved confirmation -> do not bypass or replace it; HOLD / REJECT
invalid/non-current symbolic goal -> INVALID_GOAL / HOLD
otherwise adopt the exact symbolic policy-approved goal into interaction state
no HumanCommand is synthesized
no command_id is consumed
no planner/safety/environment/replanning call occurs
```

A narrow `HumanInteractionController` API may be added for this non-human-command policy adoption. It must be deterministic and fail closed under the same state/goal checks.

Repeated adoption of the same already-approved symbolic goal may be idempotent at the state level, but M5-T02 must not create any movement or queued-execution side effect.

---

# 10. CONFIRM SEMANTICS

For a structurally valid CONFIRM decision:

```text
candidate goal must be exact and currently valid
approved_goal in the policy decision must not already bypass human confirmation
caller must supply a non-empty deterministic request_id for a new request
use HumanInteractionController.open_confirmation_request
at most one active request remains authoritative
existing active request must not be silently replaced
no goal is autonomously approved
holds_position=True
requests_human_input=True
```

If the controller is PAUSED but not STOPPED, opening/preserving a confirmation request is allowed because it causes no movement; PAUSE remains active and later explicit human CONFIRM still cannot itself execute movement.

If STOPPED, do not open a request.

Do not consume a human command ID in the bridge.

---

# 11. WAITING / DEFER SEMANTICS

For WAITING or DEFER:

```text
do not change approved_goal
do not create a goal from posterior argmax
do not invent a confirmation request without an approved candidate path
do not execute movement
preserve interaction authority state
```

DEFER must preserve D-057's stationary explicit-human-input behavior.

---

# 12. HUMAN-ACTION / DUPLICATE-PATH RULE

M5-T02 must not convert `SharedAutonomyDecision.human_action` into a new HumanCommand.

Human commands remain owned exclusively by `HumanInteractionController.handle_command`.

Therefore:

```text
no synthesized PAUSE
no synthesized STOP
no synthesized OVERRIDE
no synthesized CONFIRM
no synthesized RESUME
```

If a shared-autonomy decision reflects a human PAUSE/STOP/OVERRIDE observation, the bridge may return an explicit HOLD/authority result consistent with the controller state but must not apply a second command side effect.

If the decision's human-action field conflicts with the actual controller authority state, fail closed rather than inventing reconciliation behavior.

---

# 13. STRUCTURAL VALIDATION

Because `SharedAutonomyDecision` is directly constructible, the bridge must fail closed on materially inconsistent combinations, including at minimum:

```text
PROCEED without an approved goal
PROCEED whose candidate/approved symbolic identities conflict when both are present
CONFIRM without requires_human_confirmation=True
CONFIRM without a valid candidate
CONFIRM that already carries an autonomously approved goal
DEFER that attempts to approve a new goal
unsupported mode/type
```

Do not recalculate posterior thresholds or duplicate Bayesian/shared-autonomy policy inside the bridge.

---

