name: M5-T01 Verification

on:
  push:
    branches:
      - ci/m5-t01-verification

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact CI branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Focused M5-T01 tests
        run: python -m pytest tests/test_human_interaction.py
      - name: Adjacent control regression
        run: python -m pytest tests/test_shared_autonomy.py tests/test_safety.py tests/test_execution.py tests/test_replanning.py tests/test_human_interaction.py
      - name: Full regression
        run: python -m pytest
