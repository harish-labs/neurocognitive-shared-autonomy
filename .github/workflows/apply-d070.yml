name: Apply D-070 governance

on:
  push:
    branches:
      - ops/d070-governance

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply D-070 to canonical main
        run: |
          cp .github/scripts/apply_d070.py /tmp/apply_d070.py
          git config user.name "harish-labs"
          git config user.email "145137376+harish-labs@users.noreply.github.com"
          git fetch origin main
          git switch main
          git reset --hard origin/main
          test "$(git rev-parse HEAD)" = "98108558d64b45d2936d3beec10bf102fdf12b7d"
          python /tmp/apply_d070.py
          git add DECISIONS.md
          git commit -m "Approve stepwise replanning contract D-070"
          git push origin main
