name: Verify M5-T04 candidate

on:
  push:
    branches:
      - ci/m5-t04-verification

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify candidate parent
        run: |
          test "$(git rev-parse HEAD^)" = "12a5230c0e4c3adcf83a687dfe5e5155e4f446e1"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pandas scikit-learn pytest
      - name: Focused suite
        run: python -m pytest tests/test_navigation_runtime.py tests/test_navigation_replanning.py tests/test_human_interaction.py tests/test_interaction_bridge.py tests/test_planner.py tests/test_safety.py
      - name: Adjacent suite
        run: python -m pytest tests/test_navigation_runtime.py tests/test_navigation_replanning.py tests/test_human_interaction.py tests/test_interaction_bridge.py tests/test_planner.py tests/test_safety.py tests/test_execution.py tests/test_replanning.py tests/test_shared_autonomy.py
      - name: Full suite
        run: python -m pytest
