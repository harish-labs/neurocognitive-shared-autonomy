name: Reconcile split protocol
on:
  push:
    branches: [docs/split-protocol-reconciliation]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/split-protocol-reconciliation
          fetch-depth: 0
      - name: Apply and validate reconciliation
        run: |
          python .github/scripts/reconcile_split_protocol.py
          git diff --check
          grep -q "D-040" docs/06_DATASET_AND_DATA_PIPELINE.md
          grep -q "D-041" docs/17_EXPERIMENTAL_DESIGN.md
          grep -q "seed-42 frozen subject manifest" docs/18_METRICS_AND_EVALUATION.md
          grep -q "Resolved for EEG split/evaluation by D-040 through D-042" AGENTS.md
          grep -q "M1-T03 completed, reviewed, and merged" PROJECT_STATE.md
      - name: Commit reconciled files and remove temporary automation
        run: |
          rm .github/workflows/reconcile_split_protocol.yml
          rm .github/scripts/reconcile_split_protocol.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile split protocol methodology and project state"
          git push origin HEAD:docs/split-protocol-reconciliation
