name: Temporary final M1-T03 governance reconciliation

on:
  push:
    branches:
      - state/m1-t03-governance-ready

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: state/m1-t03-governance-ready
          fetch-depth: 0

      - name: Reconcile governance files exactly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}: {old[:80]!r}')
              p.write_text(s.replace(old, new))

          # CURRENT_TASK: update canonical governance reference and record completed doc alignment,
          # while preserving the explicit no-active-task gate.
          replace_once(
              'CURRENT_TASK.md',
              '''Latest canonical governance commit:\n\n```text\n37554d65554f4e473fa42316c7e0801ffcdee2af\nRecord approved M1-T03 preprocessing decisions (#4)\n```''',
              '''Latest canonical governance commit:\n\n```text\nd71292387d4476b8ab40841d4ed1544cba3d81b6\nReconcile numbered methodology for M1-T03 (#6)\n```''')
          replace_once(
              'CURRENT_TASK.md',
              '''Scientific preprocessing decisions U-001 through U-009 are now approved and recorded as D-031 through D-039 in `DECISIONS.md`.\n\nThis removes the scientific-parameter blocker for an M1-T03 preprocessing/epoching ticket, but it does **not** itself authorize implementation.''',
              '''Scientific preprocessing decisions U-001 through U-009 are approved and recorded as D-031 through D-039 in `DECISIONS.md`. The affected numbered methodology documents (`docs/06`, `docs/08`, and `docs/15`) are reconciled to those decisions on canonical `main`.\n\nThe scientific and documentation prerequisites for drafting an M1-T03 preprocessing/epoching ticket are satisfied, but this does **not** itself authorize implementation.''')

          # PROJECT_STATE: remove the completed documentation blocker while keeping M1-T03 inactive.
          replace_once(
              'PROJECT_STATE.md',
              'Latest Canonical Governance Commit:\n37554d65554f4e473fa42316c7e0801ffcdee2af',
              'Latest Canonical Governance Commit:\nd71292387d4476b8ab40841d4ed1544cba3d81b6')
          replace_once(
              'PROJECT_STATE.md',
              '''> **M1-T01 and M1-T02 are completed, merged, and verified on canonical `main`. The repository has a verified EEGBCI loader and a verified EEG visualization/inspection module. Project Owner approvals resolving preprocessing decisions U-001 through U-009 are recorded as D-031 through D-039 in `DECISIONS.md`. No preprocessing or epoching code has been implemented or authorized yet. Before M1-T03 implementation is authorized, affected numbered scientific documents must be reconciled so they no longer present those decisions as unresolved.**''',
              '''> **M1-T01 and M1-T02 are completed, merged, and verified on canonical `main`. The repository has a verified EEGBCI loader and a verified EEG visualization/inspection module. Project Owner approvals resolving preprocessing decisions U-001 through U-009 are recorded as D-031 through D-039 in `DECISIONS.md`, and the affected numbered methodology documents are reconciled to those decisions. No preprocessing or epoching code has been implemented or authorized yet. M1-T03 is ready for a separate explicit implementation ticket.**''')
          replace_once(
              'PROJECT_STATE.md',
              '''## Current decision-alignment status\n\n`DECISIONS.md` is authoritative and now resolves U-001 through U-009 as D-031 through D-039.\n\nThe following numbered documents still contain pre-approval wording that describes some or all of those decisions as unresolved and therefore require a documentation-only reconciliation before M1-T03 implementation is authorized:\n\n```text\ndocs/06_DATASET_AND_DATA_PIPELINE.md\ndocs/08_EEG_SIGNAL_PROCESSING_AND_ML.md\ndocs/15_IMPLEMENTATION_BLUEPRINT.md\n```\n\nUntil that reconciliation is merged, `DECISIONS.md` takes precedence and Codex must not implement M1-T03.''',
              '''## Current decision-alignment status\n\n`DECISIONS.md` resolves U-001 through U-009 as D-031 through D-039. The affected numbered methodology documents are aligned on canonical `main`:\n\n```text\ndocs/06_DATASET_AND_DATA_PIPELINE.md\ndocs/08_EEG_SIGNAL_PROCESSING_AND_ML.md\ndocs/15_IMPLEMENTATION_BLUEPRINT.md\n```\n\nNo scientific/documentation alignment blocker remains for drafting M1-T03. Implementation remains unauthorized until `CURRENT_TASK.md` contains an explicitly approved active ticket.''')
          replace_once(
              'PROJECT_STATE.md',
              '''> **M1-T03 preprocessing/epoching is the next candidate implementation task, but it is not yet authorized. First reconcile the affected numbered documentation with D-031 through D-039, review and merge that documentation-only change, then obtain explicit Project Owner approval for a new `CURRENT_TASK.md` implementation ticket.**\n\nDo not begin preprocessing or epoching until those gates are satisfied.''',
              '''> **M1-T03 preprocessing/epoching is the next candidate implementation task and its scientific/documentation prerequisites are satisfied, but it is not yet authorized. A new `CURRENT_TASK.md` implementation ticket must be explicitly approved before coding begins.**\n\nDo not begin preprocessing or epoching until that authorization exists.''')
          replace_once(
              'PROJECT_STATE.md',
              '| 3 | EEG Preprocessing / Epochs | BLOCKED | No | No | — | Scientific parameters approved; numbered-doc reconciliation + active ticket still required |',
              '| 3 | EEG Preprocessing / Epochs | BLOCKED | No | No | — | Scientific/docs prerequisites satisfied; active implementation ticket still required |')
          replace_once(
              'PROJECT_STATE.md',
              '''Current state:\n\n```text\nDocumentation/code-governance consistency blocker:\n- docs/06_DATASET_AND_DATA_PIPELINE.md still contains pre-approval unresolved wording for U-001–U-009\n- docs/08_EEG_SIGNAL_PROCESSING_AND_ML.md still contains pre-approval unresolved wording for U-001–U-009\n- docs/15_IMPLEMENTATION_BLUEPRINT.md still lists several now-approved M1 preprocessing parameters as blockers\n```\n\nRequired action:\n\n```text\nReconcile those documents to D-031 through D-039\n→ review diff\n→ merge documentation-only PR\n→ then create/approve M1-T03 implementation ticket\n```\n\nDo not invent other technical blockers before actual implementation.''',
              '''Current state:\n\n```text\nNone currently blocking repository consistency for M1-T03 preparation.\n```\n\nM1-T03 remains blocked from implementation only because no active `CURRENT_TASK.md` ticket has been explicitly approved. Do not invent technical blockers before actual implementation.''')

          # AGENTS: distinguish resolved initial preprocessing parameters from still-unresolved boundaries.
          replace_once(
              'AGENTS.md',
              '''Currently unresolved or change-controlled items include:\n\n1. exact EEG filter band;\n2. EEG reference;\n3. epoch interval;\n4. baseline correction;\n5. artifact-handling policy;\n6. T0 policy;\n7. processed-data format;\n8. final train/validation/test protocol;\n9. final cross-subject protocol;\n10. final CSP settings;\n11. final EEGNet architecture/hyperparameters;\n12. calibration method;\n13. calibration fitting partition;\n14. calibration binning;\n15. Bayesian goal-evidence likelihood construction;\n16. binary EEG-to-multiple-goal interaction protocol;\n17. Bayesian stopping/commitment rule;\n18. confidence thresholds;\n19. exact adaptation mechanism;\n20. environmental risk scale;\n21. risk weight \\(\\lambda\\);\n22. prohibited-hazard threshold;\n23. final A/B/C/D component matrix;\n24. final statistical-analysis policy.''',
              '''Resolved for the initial M1 preprocessing/epoching pipeline by D-031 through D-039:\n\n```text\n7–30 Hz band-pass\naverage EEG reference\ncanonical epoch -1.0 s to +4.0 s\ninitial CSP crop +1.0 s to +2.0 s\nbaseline=None\nno ICA / no automatic interpolation; reject >150 µV peak-to-peak and log\nexclude T0 from binary training; preserve annotations/provenance\npreserve all 64 validated EEG channels\nno resampling; preserve 160 Hz\ncanonical MNE Epochs; persisted *-epo.fif\n```\n\nCurrently unresolved or change-controlled items include:\n\n1. final train/validation/test protocol;\n2. final cross-subject protocol;\n3. final CSP settings;\n4. final EEGNet architecture/hyperparameters;\n5. calibration method;\n6. calibration fitting partition;\n7. calibration binning;\n8. Bayesian goal-evidence likelihood construction;\n9. binary EEG-to-multiple-goal interaction protocol;\n10. Bayesian stopping/commitment rule;\n11. confidence thresholds;\n12. exact adaptation mechanism;\n13. environmental risk scale;\n14. risk weight \\(\\lambda\\);\n15. prohibited-hazard threshold;\n16. final A/B/C/D component matrix;\n17. final statistical-analysis policy.''')

          # TODO: record the completed documentation gate without activating code.
          replace_once(
              'TODO.md',
              '[x] Record approved M1-T03 preprocessing decisions U-001 through U-009',
              '[x] Record approved M1-T03 preprocessing decisions U-001 through U-009\n[x] Reconcile docs/06, docs/08, and docs/15 to D-031 through D-039')
          PY

          git diff --check

      - name: Validate governance invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'NO ACTIVE TASK / PENDING APPROVAL' CURRENT_TASK.md
          grep -Fq 'Do not begin M1-T03 preprocessing/epoching until a new implementation ticket is explicitly approved' CURRENT_TASK.md
          grep -Fq 'M1-T03 is ready for a separate explicit implementation ticket' PROJECT_STATE.md
          grep -Fq 'active implementation ticket still required' PROJECT_STATE.md
          ! grep -Fq 'Documentation/code-governance consistency blocker' PROJECT_STATE.md
          grep -Fq 'Resolved for the initial M1 preprocessing/epoching pipeline by D-031 through D-039' AGENTS.md
          ! grep -Fq '1. exact EEG filter band;' AGENTS.md
          grep -Fq '[x] Reconcile docs/06, docs/08, and docs/15 to D-031 through D-039' TODO.md

      - name: Commit reconciled governance and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-final-m1-t03-governance.yml
          git add AGENTS.md CURRENT_TASK.md PROJECT_STATE.md TODO.md
          git commit -m 'Finalize M1-T03 governance readiness'
          git push origin HEAD:state/m1-t03-governance-ready
